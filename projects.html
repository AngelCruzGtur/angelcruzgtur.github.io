<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad:false, theme:"base", securityLevel:"loose",
      flowchart:{curve:"basis",nodeSpacing:50,rankSpacing:60,padding:16},
      themeVariables:{
        background:"transparent",fontFamily:"Inter,sans-serif",
        primaryColor:"#2a3a4a",primaryTextColor:"#e8eaed",primaryBorderColor:"#4a5568",
        secondaryColor:"#2d4a3a",secondaryTextColor:"#e8eaed",secondaryBorderColor:"#4a5568",
        tertiaryColor:"#4a3a28",tertiaryTextColor:"#e8eaed",tertiaryBorderColor:"#c9a84c",
        lineColor:"#6b7280",nodeBorder:"#4a5568",clusterBkg:"#1a1a1a",clusterBorder:"#333"
      }
    });
    window.renderMermaid = async function(code,id){
      const el=document.getElementById(id); if(!el)return;
      try{const r=await mermaid.render("fc-"+Date.now(),code);el.innerHTML=r.svg;}
      catch(e){el.innerHTML='<p style="color:#999;font-size:12px;text-align:center">Chart unavailable</p>';}
    };
  </script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

    :root{
      --bg:#e8e8e8;
      --card:#f5f5f5;
      --border:rgba(0,0,0,0.08);
      --text:#18150f;
      --sub:rgba(24,21,15,0.58);
      --muted:rgba(24,21,15,0.35);
      --amber:#a85c0a;
      --green:#276840;
      --tag-bg:rgba(0,0,0,0.05);
      --tag-border:rgba(0,0,0,0.09);
    }

    html,body{width:100%;min-height:100%;background:var(--bg);font-family:"Inter",sans-serif;color:var(--text);overflow-x:hidden;}

    body::before{
      content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(circle,rgba(0,0,0,0.07) 1.2px,transparent 1.2px),
        radial-gradient(ellipse 75% 50% at 5% 95%,rgba(180,130,50,0.14) 0%,transparent 55%),
        radial-gradient(ellipse 55% 40% at 95% 5%,rgba(160,110,40,0.11) 0%,transparent 55%);
      background-size:18px 18px,100% 100%,100% 100%;
      background-color:var(--bg);
    }

    /* ── CLOSE ── */
    .close-btn{
      position:fixed;top:1rem;right:1.25rem;z-index:300;
      font-family:'Press Start 2P',cursive;
      font-size:clamp(9px,0.85vw,12px);
      padding:0.55rem 1rem;
      background:#d4d0c8;color:#2a2620;
      border:3px solid #1a1714;
      box-shadow:inset 2px 2px 0 #eceae4,inset -2px -2px 0 #8a8880;
      cursor:pointer;letter-spacing:.05em;
    }
    .close-btn:hover{background:#bfbcb5;}

    /* ── PAGE ── */
    .page{
      position:relative;z-index:1;
      max-width:1160px;margin:0 auto;
      padding:clamp(3.5rem,7vh,5rem) clamp(1.5rem,4vw,3rem) 4rem;
    }

    /* ── SEARCH ── */
    .search-wrap{position:relative;max-width:400px;margin:0 auto clamp(2.5rem,5vh,3.5rem);}
    .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none;}
    .search-input{
      width:100%;padding:11px 14px 11px 38px;
      background:rgba(255,255,255,0.75);border:1px solid var(--border);
      border-radius:12px;font:500 14px/1 "Inter",sans-serif;color:var(--text);outline:none;
      transition:background .2s,border-color .2s;
    }
    .search-input::placeholder{color:var(--muted);}
    .search-input:focus{background:#fff;border-color:rgba(0,0,0,0.16);}

    /* ── COLUMNS ── */
    .columns{display:grid;grid-template-columns:1fr 1fr;gap:0 3rem;align-items:start;}
    .col-left{border-right:1px solid rgba(0,0,0,0.07);padding-right:3rem;display:flex;flex-direction:column;gap:2.5rem;}
    .col-right{display:flex;flex-direction:column;gap:2.5rem;}

    /* ── SECTION HEADER ── */
    .sec-head{display:flex;align-items:center;gap:0.8rem;margin-bottom:1rem;}
    .sec-label{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
    .sec-line{flex:1;height:1px;background:rgba(0,0,0,0.08);}

    /* ── PROJECT CARD ── */
    .card-list{display:flex;flex-direction:column;gap:0.75rem;}

    .card{
      background:var(--card);border:1px solid var(--border);border-radius:14px;
      overflow:hidden;cursor:pointer;
      display:grid;grid-template-columns:100px 1fr;
      transition:box-shadow .22s,transform .22s,border-color .22s;
    }
    .card:hover{box-shadow:0 8px 28px rgba(0,0,0,0.1);transform:translateY(-2px);border-color:rgba(0,0,0,0.13);}

    .card-thumb{
      display:flex;align-items:center;justify-content:center;
      padding:10px;min-height:88px;
    }
    .card-thumb img{width:100%;max-height:66px;object-fit:contain;object-position:center;display:block;border-radius:5px;}
    .card-thumb img.hidden{display:none;}
    .card-thumb .fallback{font-size:30px;line-height:1;}

    .card-body{padding:12px 13px 12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0;}
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
    .card-name{font-size:13.5px;font-weight:650;line-height:1.3;min-width:0;}
    .card-date{font-size:10.5px;font-weight:600;color:var(--amber);white-space:nowrap;flex-shrink:0;}
    .card-type{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .card-hackathon{
      display:inline-flex;align-items:center;gap:4px;align-self:flex-start;
      font-size:9.5px;font-weight:700;color:var(--amber);
      background:rgba(168,92,10,0.07);border:1px solid rgba(168,92,10,0.17);
      border-radius:20px;padding:2px 7px;
    }
    .card-desc{
      font-size:12px;line-height:1.55;color:var(--sub);
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;}
    .card-tag{font-size:10px;font-weight:500;padding:2px 6px;border-radius:20px;background:var(--tag-bg);border:1px solid var(--tag-border);color:var(--sub);}

    /* ── WIP CARD ── */
    .wip-card{
      background:var(--card);border:1px solid rgba(39,104,64,0.18);
      border-radius:14px;padding:13px 15px;
      transition:box-shadow .22s,transform .22s;
    }
    .wip-card:hover{box-shadow:0 6px 22px rgba(0,0,0,0.07);transform:translateY(-1px);}
    .wip-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px;}
    .wip-name{font-size:13px;font-weight:650;}
    .wip-badge{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--green);}
    .wip-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.8s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .wip-type{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(39,104,64,0.65);margin-bottom:4px;}
    .wip-desc{font-size:11.5px;line-height:1.55;color:var(--sub);margin-bottom:7px;}
    .wip-prog-row{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-bottom:3px;}
    .wip-bar{height:3px;background:rgba(0,0,0,0.07);border-radius:2px;overflow:hidden;margin-bottom:7px;}
    .wip-fill{height:100%;background:linear-gradient(90deg,#276840,#52b878);border-radius:2px;}
    .wip-tags{display:flex;flex-wrap:wrap;gap:3px;}
    .wip-tag{font-size:9.5px;font-weight:500;padding:2px 6px;border-radius:20px;background:rgba(39,104,64,0.06);border:1px solid rgba(39,104,64,0.18);color:rgba(39,104,64,0.85);}

    /* ── NO RESULTS ── */
    .no-results{text-align:center;padding:3rem 0;color:var(--muted);font-size:14px;}

    /* ── OVERLAY ── */
    .overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.3);opacity:0;pointer-events:none;transition:opacity .3s;}
    .overlay.show{opacity:1;pointer-events:all;}

    /* ── SHEET ── */
    .sheet{
      position:fixed;bottom:0;left:0;right:0;z-index:500;max-height:88vh;
      background:#fffdf8;border-radius:20px 20px 0 0;
      border-top:1px solid rgba(0,0,0,0.07);
      box-shadow:0 -8px 40px rgba(0,0,0,0.1);
      display:flex;flex-direction:column;
      transform:translateY(100%);transition:transform .4s cubic-bezier(0.32,0.72,0,1);
    }
    .sheet.show{transform:translateY(0);}
    .sheet-handle{width:36px;height:4px;background:rgba(0,0,0,0.1);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
    .sheet-scroll{overflow-y:auto;padding:1.1rem 1.6rem 2.5rem;flex:1;}
    .sheet-scroll::-webkit-scrollbar{display:none;}

    .sheet-header{display:flex;align-items:center;gap:1rem;padding-bottom:1rem;margin-bottom:1rem;border-bottom:1px solid rgba(0,0,0,0.07);}
    .sheet-thumb{width:56px;height:56px;border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
    .sheet-thumb img{width:90%;height:90%;object-fit:contain;}
    .sheet-thumb img.hidden{display:none;}
    .sheet-meta{flex:1;min-width:0;}
    .sheet-name{font-size:18px;font-weight:700;margin-bottom:2px;}
    .sheet-type{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);}
    .sheet-date{font-size:12px;font-weight:600;color:var(--amber);flex-shrink:0;}

    .sheet-desc{font-size:14px;line-height:1.65;color:var(--sub);margin-bottom:1rem;}
    .sheet-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem;}
    .sheet-tag{font-size:12px;font-weight:500;padding:4px 10px;border-radius:20px;background:var(--tag-bg);border:1px solid var(--tag-border);color:var(--sub);}

    .detail-sec{margin-bottom:1.2rem;}
    .detail-sec h3{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:0.6rem;}
    .detail-list{list-style:none;display:flex;flex-direction:column;gap:9px;}
    .detail-list li{font-size:13.5px;line-height:1.6;color:var(--sub);padding-left:1.1rem;position:relative;}
    .detail-list li::before{content:"▸";position:absolute;left:0;top:3px;color:var(--amber);font-size:10px;}

    .chart-sec h3{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:0.6rem;}
    .chart-box{background:rgba(0,0,0,0.025);border:1px solid rgba(0,0,0,0.06);border-radius:12px;padding:1rem;min-height:130px;display:flex;align-items:center;justify-content:center;overflow:auto;}
    .chart-box svg{width:100%;height:auto;background:transparent;}

    @media(max-width:720px){
      .columns{grid-template-columns:1fr;}
      .col-left{border-right:none;padding-right:0;border-bottom:1px solid rgba(0,0,0,0.07);padding-bottom:2rem;}
      .card{grid-template-columns:80px 1fr;}
    }
  </style>
</head>
<body>

<button class="close-btn" onclick="window.parent.postMessage('closeProjects','*')">✕ Close</button>

<div class="page">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" id="searchInput" placeholder="Search projects…" autocomplete="off">
  </div>

  <div class="columns">
    <div class="col-left">
      <div>
        <div class="sec-head"><p class="sec-label">Projects</p><div class="sec-line"></div></div>
        <div class="card-list" id="projectList"></div>
      </div>
      <div>
        <div class="sec-head"><p class="sec-label">Research</p><div class="sec-line"></div></div>
        <div class="card-list" id="researchList"></div>
      </div>
      <div>
        <div class="sec-head"><p class="sec-label">In Progress</p><div class="sec-line"></div></div>
        <div class="card-list" id="wipList"></div>
      </div>
    </div>
    <div class="col-right">
      <div>
        <div class="sec-head"><p class="sec-label">Hackathons</p><div class="sec-line"></div></div>
        <div class="card-list" id="hackList"></div>
      </div>
    </div>
  </div>

  <p class="no-results" id="noResults" style="display:none">No projects found.</p>
</div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-scroll" id="sheetScroll"></div>
</div>

<script>
const G=`
classDef start fill:#3f4f5f,stroke:#cbd5e1,color:#f8fafc,stroke-width:1.5px;
classDef process fill:#4f6d5f,stroke:#cbd5e1,color:#f8fafc,stroke-width:1.5px;
classDef decision fill:#6b5f4a,stroke:#f5d06f,color:#f8fafc,stroke-width:1.5px;
`;

const projects=[
  {name:"Forge",date:"2026",type:"Bioinformatics / ML Pipeline",emoji:"🧬",image:"images/forge.png",color:"linear-gradient(145deg,#1e3a5f,#2a5298)",
   desc:"A reference-free DNA analysis pipeline that detects cancer and antibiotic resistance from raw sequencing reads — no genome alignment required.",
   tags:["Python","PyTorch","NetworkX","Claude API","GNN"],
   bullets:["Assembled raw reads into De Bruijn graphs and extracted 14 graph-level features for downstream classification.","Trained a GNN using GCN layers, Graph Attention, and global mean+max pooling to classify genomic patterns.","Replaced brute-force grid search with an LLM-driven parameter optimizer and added a natural language query interface."],
   chart:`flowchart LR\n  A((Raw Reads))-->B[De Bruijn Graph]\n  B-->C[Feature Extraction]\n  C-->D{GNN Classifier}\n  D-->E[GCN Layers]\n  D-->F[Graph Attention]\n  E-->G[Pooling]\n  F-->G\n  G-->H[LLM Optimizer]\n  H-->I((Prediction))\n${G}\n  class A,I start;class B,C,E,F,G,H process;class D decision;`},
  {name:"Mini Me AI",date:"2026",type:"Local AI Systems",emoji:"🤖",image:"images/mini-me-ai.png",color:"linear-gradient(145deg,#1a3a3a,#2a7a7a)",
   desc:"A local AI assistant focused on running LLMs without relying on cloud APIs, integrating voice and real-time interaction.",
   tags:["C++","Python","Ollama","Piper","Vosk"],
   bullets:["Runs local LLM inference through Ollama instead of depending fully on external APIs.","Uses voice input and text-to-speech to make the assistant feel more interactive.","Connects local AI, personality behavior, and system-level constraints into one project."],
   chart:`flowchart LR\n  A((User Input))-->B[Speech / Text]\n  B-->C{Input Type}\n  C-->D[Local LLM]\n  C-->E[System Logic]\n  D-->F[Response]\n  E-->F\n  F-->G((Voice Output))\n${G}\n  class A,G start;class B,D,E,F process;class C decision;`}
];

const research=[
  {name:"Research Paper",date:"2026",type:"Academic Research",emoji:"📄",image:"images/research-paper.png",color:"linear-gradient(145deg,#4a3520,#8b5e3c)",
   desc:'"Rethinking Deep Self-Attention for Character-Level Language Modeling" — a counterargument paper challenging the assumption that transformers fully replace RNNs.',
   tags:["Research","Transformers","RNNs","NLP","Academic Writing"],
   bullets:["Challenged the prevailing claim that deep self-attention architectures supersede recurrent networks for character-level language modeling.","Analyzed trade-offs including fixed context windows, quadratic computational cost, and long-term dependency limitations.","Proposed hybrid and sequential architectures as a more practical direction, grounded in empirical and theoretical analysis."],
   chart:`flowchart LR\n  A((Claim))-->B{Evaluation}\n  B-->C[Context Windows]\n  B-->D[Compute Cost]\n  B-->E[Long-term Deps]\n  C-->F[Trade-off Analysis]\n  D-->F\n  E-->F\n  F-->G[Hybrid Proposal]\n  G-->H((Counterargument))\n${G}\n  class A,H start;class C,D,E,F,G process;class B decision;`}
];

const hackathons=[
  {name:"WasteLess AI",date:"2026",type:"Full Stack Web App",emoji:"🗺️",hackathon:"NVIDIA GTC 2026",image:"images/wasteless-ai.png",color:"linear-gradient(145deg,#1a3a20,#2d6a35)",
   desc:"A food redistribution platform connecting restaurants with surplus food to nearby shelters using location-based matching.",
   tags:["Next.js","React","Supabase","Leaflet","NVIDIA API"],
   bullets:["Restaurants submit extra food with location, availability, quantity, and pickup windows.","The app compares shelter needs, distance, urgency, and constraints before matching.","Map and backend data work together so the system feels practical instead of just visual."],
   chart:`flowchart LR\n  A((Restaurant))-->B[Food Listing]\n  B-->C{Match Check}\n  C-->D[Location Data]\n  C-->E[Shelter Needs]\n  C-->F[Pickup Window]\n  D-->G[Matching Logic]\n  E-->G\n  F-->G\n  G-->H[Map View]\n  G-->I((Shelter))\n${G}\n  class A,I start;class B,D,E,F,G,H process;class C decision;`},
  {name:"ProfessorMatch",date:"2026",type:"Recommendation System",emoji:"🎓",hackathon:"HackHayward 2026",image:"images/professormatch.png",color:"linear-gradient(145deg,#3a1a4a,#7a3a9a)",
   desc:"A system that ranks professors using combined datasets and explains recommendations based on student goals.",
   tags:["Python","pandas","Streamlit","FastAPI","Data Cleaning"],
   bullets:["Pulls together professor ratings, course data, and profile information.","Uses ranking logic to match professors to goals like GPA, learning depth, or career value.","Shows explainable results so students understand why each professor is recommended."],
   chart:`flowchart LR\n  A((Student Goal))-->B{Goal Type}\n  B-->C[Ratings Data]\n  B-->D[Course Data]\n  B-->E[Profile Data]\n  C-->F[Data Cleaning]\n  D-->F\n  E-->F\n  F-->G[Ranking Logic]\n  G-->H[Streamlit UI]\n  H-->I((Recommendation))\n${G}\n  class A,I start;class C,D,E,F,G,H process;class B decision;`},
  {name:"Roguelike Maker",date:"2026",type:"Godot Game Generator",emoji:"🎮",hackathon:"SJSU Hackathon 2026",image:"images/roguelike-maker.png",color:"linear-gradient(145deg,#4a1a1a,#9a3a2a)",
   desc:"A prompt-to-playable-game system where an AI generator creates JSON settings that directly change a Godot roguelike prototype.",
   tags:["Godot","GDScript","JSON","Game Systems","AI Generator"],
   bullets:["Built a config pipeline where prompts changed player speed, enemy density, weapon type, and room sequence.","Connected the generated JSON into Godot so changing the config directly changed gameplay.","Implemented live config reloading — instant gameplay updates without restarting.","Implemented a map generation system using a 40×40 sprite to define and spawn the game layout."],
   chart:`flowchart LR\n  A((Prompt))-->B{AI Interprets}\n  B-->C[Player Speed]\n  B-->D[Enemy Density]\n  B-->E[Room Sequence]\n  C-->G[JSON Config]\n  D-->G\n  E-->G\n  G-->H[Godot Loader]\n  H-->I((Playable Game))\n${G}\n  class A,I start;class C,D,E,G,H process;class B decision;`}
];

const wip=[
  {name:"3D Models in HTML",type:"Dev Log",status:"Ongoing",progress:20,desc:"Converting images to Base64, slicing them with canvas, and mapping textures onto a Three.js slime.",tags:["Three.js","JavaScript","Canvas"]},
  {name:"…",type:"TBD",status:"Thinking",progress:0,desc:"Give me a problem to solve or an idea to build!",tags:["???"]}
];

const allProjects=[...projects,...research,...hackathons];

function card(p,idx){
  return `<div class="card" data-name="${p.name.toLowerCase()}" onclick="openProject(${idx})">
    <div class="card-thumb" style="background:${p.color}">
      <img src="${p.image}" alt="${p.name}" onerror="this.classList.add('hidden');this.nextElementSibling.style.display='block'">
      <span class="fallback" style="display:none">${p.emoji}</span>
    </div>
    <div class="card-body">
      <div class="card-top"><span class="card-name">${p.name}</span><span class="card-date">${p.date}</span></div>
      <div class="card-type">${p.type}</div>
      ${p.hackathon?`<span class="card-hackathon">🏆 ${p.hackathon}</span>`:''}
      <p class="card-desc">${p.desc}</p>
      <div class="card-tags">${p.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>
    </div>
  </div>`;
}

document.getElementById('projectList').innerHTML =projects.map((p,i)=>card(p,i)).join('');
document.getElementById('researchList').innerHTML=research.map((p,i)=>card(p,projects.length+i)).join('');
document.getElementById('hackList').innerHTML    =hackathons.map((p,i)=>card(p,projects.length+research.length+i)).join('');

document.getElementById('wipList').innerHTML=wip.map(w=>`
  <div class="wip-card">
    <div class="wip-top"><span class="wip-name">${w.name}</span><span class="wip-badge"><span class="wip-dot"></span>${w.status}</span></div>
    <div class="wip-type">${w.type}</div>
    <p class="wip-desc">${w.desc}</p>
    <div class="wip-prog-row"><span>Progress</span><span>${w.progress}%</span></div>
    <div class="wip-bar"><div class="wip-fill" style="width:${w.progress}%"></div></div>
    <div class="wip-tags">${w.tags.map(t=>`<span class="wip-tag">${t}</span>`).join('')}</div>
  </div>`).join('');

// Search
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  let any=false;
  document.querySelectorAll('.card').forEach(el=>{
    const show=!q||el.dataset.name.includes(q);
    el.style.display=show?'':'none';
    if(show)any=true;
  });
  document.getElementById('noResults').style.display=(!any&&q)?'block':'none';
});

// Sheet
let rendered={};
function openProject(i){
  const p=allProjects[i];const cid=`cs-${i}`;
  document.getElementById('sheetScroll').innerHTML=`
    <div class="sheet-header">
      <div class="sheet-thumb" style="background:${p.color}">
        <img src="${p.image}" alt="${p.name}" onerror="this.classList.add('hidden');this.nextElementSibling.style.display='block'">
        <span style="display:none;font-size:24px">${p.emoji}</span>
      </div>
      <div class="sheet-meta">
        <div class="sheet-name">${p.name}</div>
        <div class="sheet-type">${p.hackathon?`${p.type} · <span style="color:var(--amber)">${p.hackathon}</span>`:p.type}</div>
      </div>
      <div class="sheet-date">${p.date}</div>
    </div>
    <p class="sheet-desc">${p.desc}</p>
    <div class="sheet-tags">${p.tags.map(t=>`<span class="sheet-tag">${t}</span>`).join('')}</div>
    <div class="detail-sec"><h3>What it does</h3><ul class="detail-list">${p.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></div>
    <div class="chart-sec"><h3>System Flow</h3><div class="chart-box" id="${cid}">Loading…</div></div>`;
  show();
  setTimeout(()=>{if(!rendered[i]){window.renderMermaid(p.chart,cid);rendered[i]=true;}},100);
}

function show(){document.getElementById('overlay').classList.add('show');document.getElementById('sheet').classList.add('show');document.body.style.overflow='hidden';}
function closeSheet(){document.getElementById('overlay').classList.remove('show');document.getElementById('sheet').classList.remove('show');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
let ty=0;
document.getElementById('sheet').addEventListener('touchstart',e=>{ty=e.touches[0].clientY;},{passive:true});
document.getElementById('sheet').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-ty>80)closeSheet();},{passive:true});
</script>
</body>
</html>
