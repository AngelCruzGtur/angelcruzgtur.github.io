<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Minecraft Slime Face</title>
	<link rel="icon" type="image/png" href="media/AC_pfp.png">
	<style>
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: transparent;
		}

		canvas {
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			display: block;
			background: transparent;
		}
	</style>
</head>
<body>
	<canvas id="c"></canvas>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r122/three.min.js"></script>

	<script>
		const canvas = document.getElementById("c");
		const params = new URLSearchParams(window.location.search);
		const mode = params.get("mode") || "free";
		const isRunnerMode = mode === "runner";

		const scene = new THREE.Scene();
		const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 1000);
		const runnerBaseScale = 2.2;
		camera.position.set(0, isRunnerMode ? 4.1 : 5.8, isRunnerMode ? 24 : 48);
		camera.lookAt(0, 0, 0);

		const renderer = new THREE.WebGLRenderer({
			canvas,
			alpha: true,
			antialias: false
		});

		renderer.setPixelRatio(window.devicePixelRatio || 1);
		renderer.setSize(innerWidth, innerHeight);
		renderer.setClearColor(0x000000, 0);

		scene.add(new THREE.AmbientLight(0xffffff, 0.92));

		const light = new THREE.DirectionalLight(0xffffff, 0.68);
		light.position.set(8, 12, 10);
		scene.add(light);

		const source = new Image();
		source.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAAFABAMAAADe49A5AAAAJFBMVEVHcExzwmJitkp7ymJaqkN7zmpocwpRoD5+v24WKBB1uWQKCgpRuk/sAAAAB3RSTlMAtLS0tLQI7015YAAAAuhJREFUeNrt3MFtgzAYgFFWYIWs0BW6QlfoCl2hK3SFrJDlKnzAimVTA67A5H2nRvjQPOVi2fzDUNk49TEXPr5NjXPvU7XrhtX9ZBr6CSBAgAABAgQIECBAgBu6TcXvn5jEatcBBAgQIECAAAECBAgQYOVWLiEKOnEDV6TMrdvD1iUlQIAAAQIECBAgQIAAtwLe5nJicdtWsW4j4GMKIECAAAECBAgQIECArweYYIUtWniQAC6vW/8fXOFQCSBAgAABAgQIECBAgOtKiJKzo3hiVLsOIECAAAECBAgQIECAAP8uXlG7PRd3bOEd/9p1e9i6pAQIECBAgAABAgQIEOCGchfYxlIV69YDFm+2AQQIECBAgAABAgQIsDvA1uON/2Vc8mPupL8sgAABAgQIECBAgAABrqv1eOPW6x6ZAAIECBAgQIAAAQIE2Dtg6/HGR41LBggQIECAAAECBAgQYHeADccbt173OQUQIECAAAECBAgQIMDLArYZb3z8uGSAAAECBAgQIECAAAGeH7D1eOPjxyUDBAgQIECAAAECBAjw/ICtxxsfNS4ZIECAAAECBAgQIECAPQHmLpyNpQ5YBxAgQIAAAQIECBAgwCsCLve1o0EAAQIECBAgQIAAAQLcDvg9d5+LTuFjsgQgQIAAAQogQIAAAQJsDBj+KgLGp/QAAgQIECBAgAABAgS4A/D+XA4wUQQIECBAgAIIECBAgACbbOUSxQiY7OIcKgEECBAgQIAAAQIUwCaAXrQBCBAgQIAAAQIECBDgiYjwAgQIECBAgAABAgQIcAdgckUt91J/7gJb7Ws4l778BhAgQIAAAQIECBAgwK2AyfevHS9W8bTICxAgQIAAAQIECBAgQICLr9IUx4tVPC2OUAYIECBAgAABAgQIECDA52+YQ1g+VKo4crrqQACAAAECBAgQIECAAAFuBfSiDUCAAAECBAgQIECAACVJkiRJkiRJkiRJkiRJkiRJkqS1/QLuvlkT9WDO3gAAAABJRU5ErkJggg==";

		source.onload = () => {
			const slime = new THREE.Group();
			scene.add(slime);

			const size = 4.7;
			const scale = source.width / 64;

			function cropTexture(x, y, w, h, outSize = 64) {
				const face = document.createElement("canvas");
				face.width = outSize;
				face.height = outSize;

				const faceCtx = face.getContext("2d");
				faceCtx.imageSmoothingEnabled = false;
				faceCtx.clearRect(0, 0, outSize, outSize);
				faceCtx.drawImage(
					source,
					x * scale,
					y * scale,
					w * scale,
					h * scale,
					0,
					0,
					outSize,
					outSize
				);

				const tex = new THREE.CanvasTexture(face);
				tex.magFilter = THREE.NearestFilter;
				tex.minFilter = THREE.NearestFilter;
				tex.wrapS = THREE.ClampToEdgeWrapping;
				tex.wrapT = THREE.ClampToEdgeWrapping;
				tex.needsUpdate = true;
				return tex;
			}

			function material(x, y, w, h, opacity = 0.72) {
				return new THREE.MeshLambertMaterial({
					map: cropTexture(x, y, w, h),
					transparent: true,
					alphaTest: 0.01,
					opacity,
					side: THREE.DoubleSide
				});
			}

			const outerCube = new THREE.Mesh(
				new THREE.BoxGeometry(size, size, size),
				[
					material(0, 8, 8, 8),
					material(16, 8, 8, 8),
					material(8, 0, 8, 8),
					material(16, 0, 8, 8),
					material(8, 8, 8, 8),
					material(24, 8, 8, 8)
				]
			);

			const innerCube = new THREE.Mesh(
				new THREE.BoxGeometry(size * 0.7, size * 0.7, size * 0.7),
				new THREE.MeshLambertMaterial({
					color: 0x4fc54a,
					transparent: true,
					opacity: 0.42,
					side: THREE.DoubleSide
				})
			);

			innerCube.position.y = -0.08;

			const faceMat = new THREE.MeshBasicMaterial({
				color: 0x315927,
				transparent: true,
				opacity: 0.62,
				depthWrite: false
			});

			function faceBlock(w, h, x, y) {
				const mesh = new THREE.Mesh(
					new THREE.BoxGeometry(w, h, 0.14),
					faceMat
				);
				mesh.position.set(x, y, size / 2 + 0.1);
				return mesh;
			}

			const leftEye = faceBlock(0.9, 1.05, -0.9, 0.45);
			const rightEye = faceBlock(0.9, 1.05, 0.9, 0.45);
			const mouth = faceBlock(0.56, 0.56, 0, -1.0);

			slime.add(outerCube, innerCube, leftEye, rightEye, mouth);

			let mouseX = 0;
			let x = 0;
			let y = 0;
			let vx = 0;
			let vy = 0;
			let grounded = true;
			let cooldown = 0;
			let squish = 0;
			let runnerState = {
				vx: 0,
				airborne: false,
				squish: 0,
				gameOver: false,
				flipping: false,
				flipProgress: 0
			};

			const gravity = -0.055;
			const hopPower = 0.48;
			const chaseStrength = 0.168;
			const friction = 0.965;
			const maxSpeed = 0.55;

			if (!isRunnerMode) {
				window.addEventListener("mousemove", (e) => {
					mouseX = (e.clientX / innerWidth) * 2 - 1;
				});
			} else {
				window.addEventListener("message", (e) => {
					if (!e.data || e.data.type !== "runnerState") return;
					runnerState = {
						vx: typeof e.data.vx === "number" ? e.data.vx : 0,
						airborne: Boolean(e.data.airborne),
						squish: typeof e.data.squish === "number" ? e.data.squish : 0,
						gameOver: Boolean(e.data.gameOver),
						flipping: Boolean(e.data.flipping),
						flipProgress: typeof e.data.flipProgress === "number" ? e.data.flipProgress : 0
					};
				});
			}

			function bounds() {
				const d = camera.position.z;
				const h = 2 * Math.tan(camera.fov * Math.PI / 360) * d;
				return {
					width: h * camera.aspect,
					left: -(h * camera.aspect) / 2,
					right: (h * camera.aspect) / 2,
					bottom: -h / 2
				};
			}

			function animate() {
				requestAnimationFrame(animate);

				if (isRunnerMode) {
					const airborne = runnerState.airborne;
					const p = Math.max(0, Math.min(1, runnerState.squish || 0));
					let sx = 1;
					let sy = 1;
					let sz = 1;

					if (airborne) {
						const wiggle = Math.sin(performance.now() * 0.011) * 0.014;
						sx = 0.99 + wiggle;
						sy = 1.025 - wiggle;
						sz = 0.99 + wiggle;
					} else if (p > 0.01) {
						const jiggle = Math.sin((1 - p) * Math.PI * 9) * p;
						sx = 1 + 0.075 * p + 0.04 * jiggle;
						sy = 1 - 0.065 * p - 0.032 * jiggle;
						sz = 1 + 0.075 * p + 0.04 * jiggle;
					} else {
						const t = performance.now() * 0.0025;
						const idle = Math.sin(t);
						const wobble = Math.sin(t * 2.5);
						sx = 1 + idle * 0.018 + wobble * 0.01;
						sy = 1 - idle * 0.02;
						sz = 1 + idle * 0.018 - wobble * 0.01;
					}

					slime.position.set(0, -0.3, 0);
					slime.scale.set(sx * runnerBaseScale, sy * runnerBaseScale, sz * runnerBaseScale);
					const targetRot = Math.atan2(runnerState.vx || 0, 30);
					const flipRot = runnerState.flipping ? runnerState.flipProgress * Math.PI * 2 : 0;
					slime.rotation.x += (flipRot - slime.rotation.x) * 0.35;
					slime.rotation.y += (targetRot - slime.rotation.y) * 0.09;
					slime.rotation.z = -(runnerState.vx || 0) * 0.01;
				} else {
					const b = bounds();
					const halfWidth = size * 0.52;
					const halfHeight = size * 0.5;
					const floor = b.bottom + halfHeight;
					const target = mouseX * (b.width / 2 - halfWidth);
					const dx = target - x;

					vx += (dx / b.width) * chaseStrength;
					vx *= friction;
					vx = Math.max(-maxSpeed, Math.min(maxSpeed, vx));

					if (cooldown > 0) cooldown--;

					if (grounded && Math.abs(dx) / b.width > 0.08 && Math.abs(vx) > 0.055 && cooldown === 0) {
						vy = hopPower;
						grounded = false;
						cooldown = 210;
					}

					vy += gravity;
					x += vx;
					y += vy;

					const bounce = 0.65;
					if (x < b.left + halfWidth) {
						x = b.left + halfWidth;
						vx = -vx * bounce;
						if (grounded) {
							vy = hopPower * 0.6;
							grounded = false;
						}
					}

					if (x > b.right - halfWidth) {
						x = b.right - halfWidth;
						vx = -vx * bounce;
						if (grounded) {
							vy = hopPower * 0.6;
							grounded = false;
						}
					}

					if (y <= floor) {
						y = floor;
						if (!grounded) squish = 34;
						vy = 0;
						grounded = true;
					}

					let sx = 1;
					let sy = 1;
					let sz = 1;

					if (!grounded) {
						const wiggle = Math.sin(performance.now() * 0.011) * 0.014;
						sx = 0.99 + wiggle;
						sy = 1.025 - wiggle;
						sz = 0.99 + wiggle;
					} else if (squish > 0) {
						const p = squish / 34;
						const jiggle = Math.sin((1 - p) * Math.PI * 9) * p;
						sx = 1 + 0.075 * p + 0.04 * jiggle;
						sy = 1 - 0.065 * p - 0.032 * jiggle;
						sz = 1 + 0.075 * p + 0.04 * jiggle;
						squish--;
					} else {
						const t = performance.now() * 0.0025;
						const idle = Math.sin(t);
						const wobble = Math.sin(t * 2.5);
						sx = 1 + idle * 0.018 + wobble * 0.01;
						sy = 1 - idle * 0.02;
						sz = 1 + idle * 0.018 - wobble * 0.01;
					}

					slime.position.set(x, y, 0);
					slime.scale.set(sx, sy, sz);
					const targetRot = Math.atan2(vx, 30);
					slime.rotation.y += (targetRot - slime.rotation.y) * 0.025;
					slime.rotation.z = -vx * 0.0035;
				}

				renderer.render(scene, camera);
			}

			animate();
		};

		window.addEventListener("resize", () => {
			camera.aspect = innerWidth / innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(innerWidth, innerHeight);
		});
	</script>
</body>
</html>
